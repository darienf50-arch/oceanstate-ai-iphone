name: Build Ocean State AI Android
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '24' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Restore private release signer
        env:
          SIGNER: ${{ secrets.OCEANSTATE_ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$SIGNER" | base64 --decode > "$RUNNER_TEMP/oceanstate.jks"
      - name: Build, test and lint
        working-directory: android
        env:
          OCEANSTATE_KEYSTORE: ${{ runner.temp }}/oceanstate.jks
          OCEANSTATE_KEY_PASSWORD: ${{ secrets.OCEANSTATE_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OceanStateAI-Android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.txt
            android/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Android accessibility actions in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            result=0; gradle --no-daemon connectedDebugAndroidTest || result=$?; adb logcat -d -s chromium AndroidRuntime > build/webview-log.txt; adb pull /sdcard/Download/ocean-diagnostics build/device-screens; exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-verification
          path: |
            android/app/build/reports/androidTests/
            android/build/webview-log.txt
            android/build/device-screens/
          if-no-files-found: warn
          retention-days: 14
