name: OceanStateAI
options:
  bundleIdPrefix: com.oceanstateai
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
targets:
  OceanStateAI:
    type: application
    platform: iOS
    sources: [OceanStateAI]
    info:
      path: OceanStateAI/Info.plist
      properties:
        CFBundleDisplayName: Ocean State AI
        CFBundleShortVersionString: '3.0'
        CFBundleVersion: '5'
        UILaunchScreen: {}
        NSCameraUsageDescription: Attach photos and use video in Ocean State AI.
        NSMicrophoneUsageDescription: Use voice conversations in Ocean State AI.
        NSPhotoLibraryUsageDescription: Attach photos to your conversations.
        NSLocalNetworkUsageDescription: Connect to your Ocean State AI server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oceanstateai.iphone
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pod wrapper Tor.framework and native tor.framework collide on
        # case-insensitive framework search paths. Link the native archive by
        # its exact path so the embedded Tor entry points reach the application.
        OTHER_LDFLAGS: '$(inherited) "$(PODS_XCFRAMEWORKS_BUILD_DIR)/Tor/CTor/tor.framework/tor"'
  OceanStateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OceanStateAI
  OceanStateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OceanStateAI
schemes:
  OceanStateAI:
    build:
      targets:
        OceanStateAI: all
    archive:
      config: Release
    test:
      targets: [OceanStateTests, OceanStateUITests]
