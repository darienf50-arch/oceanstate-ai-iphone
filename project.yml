name: OceanStateAI
options:
  bundleIdPrefix: com.oceanstateai
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
targets:
  OceanStateAI:
    type: application
    platform: iOS
    sources: [OceanStateAI]
    info:
      path: OceanStateAI/Info.plist
      properties:
        CFBundleDisplayName: Ocean State AI
        CFBundleShortVersionString: '3.0'
        CFBundleVersion: '5'
        UILaunchScreen: {}
        NSCameraUsageDescription: Attach photos and use video in Ocean State AI.
        NSMicrophoneUsageDescription: Use voice conversations in Ocean State AI.
        NSPhotoLibraryUsageDescription: Attach photos to your conversations.
        NSLocalNetworkUsageDescription: Connect to your Ocean State AI server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            q3fqhm3ye5dmja4qtzw77lmbta2ne6ygbfs3k44osrwemqdvcxaw5dyd.onion:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oceanstateai.iphone
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: OceanStateAI/OceanTorBridge.h
        HEADER_SEARCH_PATHS: '$(inherited) "$(PODS_XCFRAMEWORKS_BUILD_DIR)/OceanCTor/tor.framework/Headers"'
  OceanStateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OceanStateAI
  OceanStateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OceanStateAI
schemes:
  OceanStateAI:
    build:
      targets:
        OceanStateAI: all
    archive:
      config: Release
    test:
      targets: [OceanStateTests, OceanStateUITests]
