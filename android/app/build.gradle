plugins { id 'com.android.application' }
android {
    namespace 'com.oceanstateai.mobile'
    compileSdk 37
    defaultConfig { applicationId 'com.oceanstateai.mobile'; minSdk 30; targetSdk 36; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        release {
            storeFile file(System.getenv('OCEANSTATE_KEYSTORE') ?: '../signing-not-present.jks')
            storePassword System.getenv('OCEANSTATE_KEY_PASSWORD')
            keyAlias 'oceanstate'
            keyPassword System.getenv('OCEANSTATE_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'info.guardianproject:tor-android:0.4.9.14'
    testImplementation 'junit:junit:4.13.2'
}
